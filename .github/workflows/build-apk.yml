name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -o KalagunaWidget.zip

      - name: Build APK
        working-directory: KalagunaWidget
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kalaguna-widget-apk
          path: KalagunaWidget/app/build/outputs/apk/debug/*.apk
